[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/bavanchun/ariadusage"
publish = false

[workspace.dependencies]
assert_cmd = "2.2.2"
clap = { version = "4.6.7", features = ["derive"] }
insta = { version = "1.49.0", features = ["json", "glob"] }
jiff = { version = "0.2.37", features = ["serde"] }
jsonschema = { version = "0.58.5", default-features = false }
rpassword = "7.5.4"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
tokio = { version = "~1.53", features = ["rt", "macros", "net", "process", "io-util", "time", "sync", "signal", "fs"] }
tokio-util = "0.7.19"
zeroize = { version = "1.9.0", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
