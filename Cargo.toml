[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/bavanchun/ariadusage"
publish = false

[workspace.dependencies]
assert_cmd = "2.2.2"
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
etcetera = "0.11.0"
httpmock = { version = "0.8.3", default-features = false, features = ["https"] }
insta = { version = "1.49.0", features = ["json", "glob"] }
jiff = { version = "0.2.37", features = ["serde"] }
jsonschema = { version = "0.58.5", default-features = false }
nix = { version = "0.31.3", features = ["signal"] }
process-wrap = { version = "10.0.1", default-features = false, features = ["tokio1", "process-group", "process-session", "reset-sigmask"] }
procfs = { version = "0.18.0", default-features = false }
pty-process = "0.5.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "charset"] }
rpassword = "7.5.4"
rustix = "1.1.5"
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "~1.53", features = ["rt", "macros", "net", "process", "io-util", "time", "sync", "signal", "fs"] }
tokio-util = "0.7.19"
toml = "1.1.6"
unicode-segmentation = "1.13.3"
zeroize = { version = "1.9.0", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
