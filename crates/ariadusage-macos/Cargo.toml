[package]
name = "ariadusage-macos"
description = "AriadUsage macOS menu-bar app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "ariadusage-macos"
path = "src/main.rs"

# Draws the card on the main thread, which AppKit views require.
[[test]]
name = "card_render"
path = "tests/card_render.rs"
harness = false

[[test]]
name = "settings_render"
path = "tests/settings_render.rs"
harness = false

[dependencies]
ariadusage-protocol = { version = "0.0.0", path = "../ariadusage-protocol" }
jiff = { workspace = true }
regex = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = { workspace = true }
objc2 = { workspace = true }
objc2-app-kit = { workspace = true }
objc2-foundation = { workspace = true }

[dev-dependencies]
ariadusage-protocol = { version = "0.0.0", path = "../ariadusage-protocol", features = ["fixture"] }
tempfile = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
