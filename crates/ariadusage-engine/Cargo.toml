[package]
name = "ariadusage-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "ariadusage-test-child"
path = "src/bin/ariadusage-test-child.rs"
required-features = ["test-hooks"]

[features]
default = []
test-hooks = ["dep:nix"]

[dependencies]
ariadusage-core = { version = "0.0.0", path = "../ariadusage-core" }
ariadusage-protocol = { version = "0.0.0", path = "../ariadusage-protocol", features = ["codec"] }
base64 = { workspace = true }
bytes = { workspace = true }
etcetera = { workspace = true }
jiff = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
rustls-platform-verifier = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true, features = ["codec"] }
uuid = { workspace = true }
zeroize = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true, features = ["functions", "hooks", "limits"] }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs", "process", "pipe"] }
process-wrap = { workspace = true }
nix = { workspace = true, optional = true }
pty-process = { workspace = true, features = ["async"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
aes = { workspace = true }
cbc = { workspace = true }
pbkdf2 = { workspace = true }
sha1 = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = { workspace = true }
procfs = { workspace = true }
secret-service = { workspace = true }
zbus = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
listeners = { workspace = true }
proc_pidinfo = { workspace = true }
security-framework = { workspace = true }
sysinfo = { workspace = true }

[dev-dependencies]
ariadusage-engine = { path = ".", features = ["test-hooks"] }
httpmock = { workspace = true }
proptest = { workspace = true }

[lints]
workspace = true
